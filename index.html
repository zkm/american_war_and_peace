<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War and Peace Reader</title>
<meta name="description" content="Read an 'americanized' edition of Leo Tolstoy's War and Peace, chapter by chapter.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='4' width='20' height='24' rx='2' fill='%238c2f39'/%3E%3Crect x='9' y='4' width='2' height='24' fill='%236d222b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbfaf7;
  --panel: #ffffff;
  --line: #e4e0d6;
  --text: #24211d;
  --muted: #6e675d;
  --accent: #8c2f39;
  --accent-soft: #f4e6e3;
  --shadow: rgba(30, 20, 10, .18);
  --size: 19px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #131210;
    --panel: #1b1a17;
    --line: #2e2b26;
    --text: #e2ddd3;
    --muted: #9a9386;
    --accent: #e08a8f;
    --accent-soft: #3a2224;
    --shadow: rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #131210;
  --panel: #1b1a17;
  --line: #2e2b26;
  --text: #e2ddd3;
  --muted: #9a9386;
  --accent: #e08a8f;
  --accent-soft: #3a2224;
  --shadow: rgba(0, 0, 0, .5);
}
:root[data-theme="sepia"] {
  --bg: #f3e9d6;
  --panel: #f8f0e0;
  --line: #e0d2b8;
  --text: #3b2f22;
  --muted: #7a6750;
  --accent: #8c2f39;
  --accent-soft: #ead8c2;
  --shadow: rgba(60, 40, 10, .2);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 "Source Sans 3", system-ui, sans-serif;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }

/* Top bar */
.bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  height: 52px; padding: 0 12px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--accent); width: 0; transition: width .2s; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 36px; height: 36px; padding: 0 10px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--muted);
  text-decoration: none; font-size: 14px;
}
.btn:hover { background: var(--accent-soft); color: var(--text); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.where {
  flex: 1; min-width: 0; text-align: center;
  font-size: 14px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.where a { color: inherit; text-decoration: none; }
.where b { color: var(--text); font-weight: 600; }

/* Drawer */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s; }
.drawer {
  position: fixed; z-index: 31; top: 0; bottom: 0; left: 0; width: min(340px, 88vw);
  display: flex; flex-direction: column;
  background: var(--panel); border-right: 1px solid var(--line);
  transform: translateX(-100%); transition: transform .22s ease;
}
body.toc-open .scrim { opacity: 1; pointer-events: auto; }
body.toc-open .drawer { transform: none; box-shadow: 0 0 40px var(--shadow); }
.drawer header { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--line); }
.drawer header h2 { margin: 0; font-size: 15px; font-weight: 600; }
.toc { overflow-y: auto; padding: 6px 0 32px; }
.toc details { border-bottom: 1px solid var(--line); }
.toc summary {
  display: flex; justify-content: space-between; gap: 8px; cursor: pointer;
  padding: 11px 18px; font-weight: 600; font-size: 15px; list-style: none;
}
.toc summary::-webkit-details-marker { display: none; }
.toc summary span { color: var(--muted); font-weight: 400; font-size: 13px; }
.toc .chs { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; padding: 0 14px 14px; }
.toc .chs a {
  display: block; padding: 6px 0; text-align: center; border-radius: 6px;
  color: var(--text); text-decoration: none; font-size: 13px; background: var(--bg);
}
.toc .chs a:hover { background: var(--accent-soft); }
.toc .chs a[aria-current="true"] { background: var(--accent); color: var(--panel); }

/* Cover */
.cover { max-width: 760px; margin: 0 auto; padding: 64px 20px 96px; }
.cover .kicker { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.cover h1 { font: 600 clamp(40px, 9vw, 72px)/1.05 "Literata", Georgia, serif; margin: 10px 0 8px; letter-spacing: -.01em; }
.cover .by { font: italic 20px "Literata", Georgia, serif; color: var(--muted); margin: 0 0 28px; }
.cover .blurb { font-size: 17px; max-width: 560px; margin: 0 0 28px; }
.cover .stats { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; color: var(--muted); margin-bottom: 32px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 56px; }
.primary {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px;
  background: var(--accent); color: var(--panel); text-decoration: none; font-weight: 600;
}
.secondary {
  display: inline-flex; align-items: center; padding: 11px 18px; border-radius: 10px;
  border: 1px solid var(--line); color: var(--text); text-decoration: none; font-weight: 500;
}
.primary:hover, .secondary:hover { filter: brightness(1.05); }
.cover h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.parts a {
  display: block; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); text-decoration: none;
}
.parts a:hover { border-color: var(--accent); }
.parts b { display: block; font: 600 17px "Literata", Georgia, serif; }
.parts span { font-size: 13px; color: var(--muted); }
.foot { margin-top: 56px; font-size: 13px; color: var(--muted); }

/* Chapter */
.chapter { max-width: 40em; margin: 0 auto; padding: 48px 20px 40px; font-size: var(--size); }
.chapter .part { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0; font-family: "Source Sans 3", system-ui, sans-serif; }
.chapter h1 { font: 600 1.9em/1.15 "Literata", Georgia, serif; margin: .25em 0 1.2em; }
.prose { font-family: "Literata", Georgia, serif; line-height: 1.7; hyphens: auto; -webkit-hyphens: auto; }
.prose p { margin: 0 0 1em; }
.prose p + p { text-indent: 1.4em; margin-top: -.4em; }
.prose .verse { white-space: pre-line; margin: 1.2em 0 1.2em 1.4em; font-style: italic; text-indent: 0; }
.prose .note { font-size: .82em; color: var(--muted); border-left: 2px solid var(--line); padding-left: .9em; margin: .6em 0 1.2em; text-indent: 0; }
.prose .note + p, .prose .verse + p { text-indent: 0; margin-top: 0; }
.nav {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  max-width: 40em; margin: 0 auto; padding: 8px 20px 80px;
}
.nav a {
  display: block; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
  color: var(--text); text-decoration: none; background: var(--panel);
}
.nav a:hover { border-color: var(--accent); }
.nav small { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.nav .next { text-align: right; grid-column: 2; }
.status { max-width: 40em; margin: 0 auto; padding: 80px 20px; color: var(--muted); text-align: center; }

@media (max-width: 560px) {
  .btn .lbl { display: none; }
  .chapter { padding-top: 32px; }
  .prose { hyphens: auto; }
}
@media print {
  .bar, .drawer, .scrim, .nav { display: none !important; }
}
</style>
</head>
<body>
<header class="bar">
  <button class="btn" id="tocBtn" aria-label="Contents" title="Contents (C)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span class="lbl">Contents</span>
  </button>
  <div class="where" id="where"></div>
  <button class="btn" id="smaller" aria-label="Smaller text" title="Smaller text">A−</button>
  <button class="btn" id="larger" aria-label="Larger text" title="Larger text" style="font-size:17px">A+</button>
  <button class="btn" id="themeBtn" aria-label="Change theme" title="Change theme">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>
  <div class="progress" id="progress"></div>
</header>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Contents">
  <header>
    <h2><a href="#/" style="color:inherit;text-decoration:none">Contents</a></h2>
    <button class="btn" id="closeToc" aria-label="Close contents">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <nav class="toc" id="toc"></nav>
</aside>

<main id="app"><div class="status">Loading the book…</div></main>

<script>
(function () {
  'use strict';

  const REPO = 'zkm/american_war_and_peace';
  const SRC = 'https://raw.githubusercontent.com/' + REPO + '/master/war_and_peace.txt';
  const WPM = 230;

  const app = document.getElementById('app');
  const where = document.getElementById('where');
  const tocEl = document.getElementById('toc');
  const progress = document.getElementById('progress');
  const root = document.documentElement;
  let book = null;
  let current = null;

  // ---------- storage (best effort) ----------
  function load(key) { try { return JSON.parse(localStorage.getItem('wap-' + key)); } catch (e) { return null; } }
  function save(key, val) { try { localStorage.setItem('wap-' + key, JSON.stringify(val)); } catch (e) { /* ignore */ } }

  // ---------- reading preferences ----------
  const THEMES = [null, 'sepia', 'dark', 'light'];
  let theme = load('theme');
  let size = load('size') || 19;
  function applyPrefs() {
    if (theme) root.dataset.theme = theme; else delete root.dataset.theme;
    root.style.setProperty('--size', size + 'px');
  }
  applyPrefs();
  document.getElementById('themeBtn').addEventListener('click', function () {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    save('theme', theme); applyPrefs();
  });
  document.getElementById('smaller').addEventListener('click', function () { size = Math.max(14, size - 1); save('size', size); applyPrefs(); });
  document.getElementById('larger').addEventListener('click', function () { size = Math.min(28, size + 1); save('size', size); applyPrefs(); });

  // ---------- drawer ----------
  function openToc(open) {
    document.body.classList.toggle('toc-open', open);
    if (open) {
      const cur = tocEl.querySelector('[aria-current="true"]');
      if (cur) { cur.closest('details').open = true; cur.scrollIntoView({ block: 'center' }); }
    }
  }
  document.getElementById('tocBtn').addEventListener('click', function () { openToc(!document.body.classList.contains('toc-open')); });
  document.getElementById('closeToc').addEventListener('click', function () { openToc(false); });
  document.getElementById('scrim').addEventListener('click', function () { openToc(false); });

  // ---------- parsing ----------
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  const ROMAN = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
  function toRoman(n) { let s = ''; ROMAN.forEach(function (r) { while (n >= r[0]) { s += r[1]; n -= r[0]; } }); return s; }
  function titleCase(s) { return s.toLowerCase().replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); }); }

  function parse(text) {
    let lines = text.replace(/\r\n?/g, '\n').split('\n');
    const end = lines.findIndex(function (l) { return /^End of (the )?Project Gutenberg|^\*\*\* ?END OF/i.test(l); });
    if (end !== -1) lines = lines.slice(0, end);

    const head = lines.filter(function (l) { return l.trim(); }).slice(0, 2);
    const parts = [];
    let part = null, chapter = null;
    lines.forEach(function (line) {
      const p = line.match(/^(BOOK [A-Z]+|FIRST EPILOGUE|SECOND EPILOGUE)(?::\s*(.*?))?\s*$/);
      if (p) {
        part = { name: titleCase(p[1]), years: (p[2] || '').replace(/\s*-\s*/g, '–'), chapters: [] };
        parts.push(part); chapter = null; return;
      }
      const c = part && line.match(/^CHAPTER ([IVXLC]+|\d+)\s*$/);
      if (c) {
        chapter = { num: /^\d+$/.test(c[1]) ? toRoman(+c[1]) : c[1], lines: [] };
        part.chapters.push(chapter); return;
      }
      if (chapter) chapter.lines.push(line);
    });

    const flat = [];
    let words = 0;
    parts.forEach(function (p, pi) {
      p.chapters.forEach(function (ch, ci) {
        ch.part = pi; ch.index = ci; ch.global = flat.length;
        ch.words = ch.lines.join(' ').split(/\s+/).filter(Boolean).length;
        ch.wordsBefore = words; words += ch.words;
        flat.push(ch);
      });
    });
    return {
      title: head[0] || 'War and Peace',
      author: (head[1] || '').replace(/^By\s+/i, ''),
      parts: parts, flat: flat, words: words
    };
  }

  function typo(s) { return esc(s).replace(/--/g, '—'); }

  function renderProse(lines) {
    const blocks = [];
    let cur = [];
    lines.forEach(function (l) {
      if (l.trim()) cur.push(l.replace(/\s+$/, ''));
      else if (cur.length) { blocks.push(cur); cur = []; }
    });
    if (cur.length) blocks.push(cur);
    return blocks.map(function (b) {
      const indented = b.every(function (l) { return /^\s/.test(l); });
      if (indented && /^\s*\*/.test(b[0])) {
        return '<p class="note">' + typo(b.map(function (l) { return l.trim(); }).join(' ')) + '</p>';
      }
      if (indented) {
        return '<p class="verse">' + b.map(function (l) { return typo(l.trim()); }).join('\n') + '</p>';
      }
      return '<p>' + typo(b.map(function (l) { return l.trim(); }).join(' ')) + '</p>';
    }).join('');
  }

  // ---------- views ----------
  function href(ch) { return '#/' + (ch.part + 1) + '/' + (ch.index + 1); }
  function partLabel(p) { return p.name + (p.years ? ': ' + p.years : ''); }
  function hours(words) {
    const h = words / WPM / 60;
    return h >= 1.5 ? Math.round(h) + ' hours' : Math.max(1, Math.round(words / WPM)) + ' min';
  }

  function buildToc() {
    tocEl.innerHTML = book.parts.map(function (p) {
      return '<details><summary>' + esc(p.name) + '<span>' + esc(p.years) + '</span></summary><div class="chs">' +
        p.chapters.map(function (ch) {
          return '<a href="' + href(ch) + '" data-g="' + ch.global + '" title="' + esc(p.name + ', Chapter ' + ch.num) + '">' + ch.num + '</a>';
        }).join('') + '</div></details>';
    }).join('');
    tocEl.addEventListener('click', function (e) { if (e.target.closest('a')) openToc(false); });
  }

  function markToc(g) {
    tocEl.querySelectorAll('a[aria-current]').forEach(function (a) { a.removeAttribute('aria-current'); });
    const a = tocEl.querySelector('a[data-g="' + g + '"]');
    if (a) a.setAttribute('aria-current', 'true');
  }

  function showCover() {
    current = null;
    markToc(-1);
    document.title = 'War and Peace Reader';
    where.innerHTML = '<b>' + esc(book.title) + '</b>';
    progress.style.width = '0';
    const pos = load('pos');
    const resume = pos && book.flat[pos.g];
    const first = book.flat[0];
    app.innerHTML =
      '<section class="cover">' +
        '<div class="kicker">An “americanized” edition</div>' +
        '<h1>' + esc(book.title) + '</h1>' +
        '<p class="by">' + esc(book.author) + '</p>' +
        '<p class="blurb">Tolstoy’s novel of Russia during the Napoleonic wars, with a few “enhancements” of our own. Pick up where you left off, or start in a Petersburg drawing room in July 1805.</p>' +
        '<div class="stats"><span>' + book.parts.length + ' parts</span><span>' + book.flat.length + ' chapters</span><span>' +
          Math.round(book.words / 1000) + 'k words</span><span>about ' + hours(book.words) + ' of reading</span></div>' +
        '<div class="cta">' +
          (resume
            ? '<a class="primary" href="' + href(resume) + '">Continue · ' + esc(book.parts[resume.part].name) + ', Chapter ' + resume.num + ' →</a>' +
              '<a class="secondary" href="' + href(first) + '">Start from the beginning</a>'
            : '<a class="primary" href="' + href(first) + '">Start reading →</a>') +
        '</div>' +
        '<h2>Contents</h2>' +
        '<div class="parts">' + book.parts.map(function (p) {
          const w = p.chapters.reduce(function (n, c) { return n + c.words; }, 0);
          return '<a href="' + href(p.chapters[0]) + '"><b>' + esc(p.name) + '</b><span>' +
            (p.years ? esc(p.years) + ' · ' : '') + p.chapters.length + ' chapters · ' + hours(w) + '</span></a>';
        }).join('') + '</div>' +
        '<p class="foot">Text from the Project Gutenberg edition of the Louise and Aylmer Maude translation, edited in <a href="https://github.com/' + REPO + '">' + REPO + '</a>. Public domain in the U.S.</p>' +
      '</section>';
    window.scrollTo(0, 0);
  }

  function showChapter(ch, restoreY) {
    current = ch;
    const p = book.parts[ch.part];
    const prev = book.flat[ch.global - 1], next = book.flat[ch.global + 1];
    markToc(ch.global);
    document.title = p.name + ', Chapter ' + ch.num + ' · ' + book.title;
    where.innerHTML = '<a href="#/">' + esc(book.title) + '</a> · <b>' + esc(p.name) + ', Ch. ' + ch.num + '</b>';
    app.innerHTML =
      '<article class="chapter">' +
        '<p class="part">' + esc(partLabel(p)) + '</p>' +
        '<h1>Chapter ' + ch.num + '</h1>' +
        '<div class="prose">' + renderProse(ch.lines) + '</div>' +
      '</article>' +
      '<nav class="nav">' +
        (prev ? '<a class="prev" href="' + href(prev) + '"><small>← Previous</small>' + esc(book.parts[prev.part].name) + ', Ch. ' + prev.num + '</a>' : '') +
        (next ? '<a class="next" href="' + href(next) + '"><small>Next →</small>' + esc(book.parts[next.part].name) + ', Ch. ' + next.num + '</a>'
              : '<a class="next" href="#/"><small>The end</small>Back to the cover</a>') +
      '</nav>';
    const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
    window.scrollTo(0, restoreY ? restoreY * max : 0);
    savePos();
  }

  function scrollFraction() {
    const max = document.documentElement.scrollHeight - innerHeight;
    return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  }

  function savePos() {
    if (!current) return;
    const f = scrollFraction();
    save('pos', { g: current.global, y: f });
    progress.style.width = (((current.wordsBefore + current.words * f) / book.words) * 100).toFixed(2) + '%';
  }

  let pending = false;
  addEventListener('scroll', function () {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; savePos(); });
  }, { passive: true });

  function route() {
    openToc(false);
    const m = location.hash.match(/^#\/(\d+)\/(\d+)$/);
    if (!m) { showCover(); return; }
    const p = book.parts[+m[1] - 1];
    const ch = p && p.chapters[+m[2] - 1];
    if (!ch) { location.replace('#/'); return; }
    const pos = load('pos');
    showChapter(ch, pos && pos.g === ch.global && !current ? pos.y : 0);
  }

  addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'Escape') openToc(false);
    if (e.key === 'c') openToc(!document.body.classList.contains('toc-open'));
    if (!current) return;
    if (e.key === 'ArrowRight' && book.flat[current.global + 1]) location.hash = href(book.flat[current.global + 1]);
    if (e.key === 'ArrowLeft' && book.flat[current.global - 1]) location.hash = href(book.flat[current.global - 1]);
  });

  fetch(SRC).then(function (r) {
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    return r.text();
  }).then(function (text) {
    book = parse(text);
    if (!book.flat.length) throw new Error('no chapters found');
    buildToc();
    addEventListener('hashchange', route);
    route();
  }).catch(function (err) {
    app.innerHTML = '<div class="status">Could not load the book (' + esc(err.message) + ').</div>';
  });
})();
</script>
</body>
</html>
